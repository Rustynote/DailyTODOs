    name: Deploy SvelteKit to GitHub Pages

    on:
      push:
        branches:
          - master # or your master branch

    jobs:
      build-and-deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '22.12.0' # or your preferred Node.js version

          - name: Install dependencies
            run: npm install # or pnpm install or yarn install

          - name: Build SvelteKit
            run: npm run build # or pnpm run build or yarn build

          - name: Deploy to GitHub Pages
            uses: peaceiris/actions-gh-pages@v3
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: ./build # or the directory where your static files are generated
